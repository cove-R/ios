<body><main class="device" id="device"><div class="screen" id="screen"><div class="wallpaper"></div><div class="status"><span id="statusTime">9:41</span><div class="right"><span class="signal">▂▄▆</span><span>⌁</span><span class="battery"></span></div></div><div class="island"></div>
<section class="view lock active" id="lockView"><div class="lock-date" id="lockDate">10월 23일 금요일</div><div class="lock-time" id="lockTime">9:41</div><div class="lock-weather">☀️  맑음 · 18°</div><div class="lock-bottom"><div class="lock-widgets"><div class="widget"><small>날씨</small><strong>☀️ 18°</strong><div class="tiny">맑음</div></div><div class="widget"><small>배터리</small><strong>▰▰▰▱</strong><div class="tiny">충전 중이 아님</div></div><div class="widget"><small>캘린더</small><strong id="lockCal">오늘</strong><div class="tiny">새로운 하루</div></div></div><div class="lock-controls"><button class="round" id="flashBtn" aria-label="손전등">♜</button><button class="round" id="cameraBtn" aria-label="카메라">◉</button></div><div class="swipe-hint">위로 쓸어올려 잠금 해제</div></div><div class="lock-unlock" id="unlockArea" aria-label="잠금 해제"></div></section>
<section class="view home" id="homeView"><div class="greeting"><strong>금요일, 좋은 아침 ☀️</strong><span class="date-pill" id="homeDate">10월 23일</span></div><div class="home-widget"><div><small>서울 · 현재 날씨</small><div class="big">18° ☀️</div><div class="sub">맑음 · 최고 21° / 최저 13°</div></div><div class="sun">🌤️</div></div><div class="app-grid" id="appGrid"></div><div class="page-dots"><i></i><i></i><i></i></div><div class="dock" id="dock"></div></section>
<section class="view appscreen" id="appView"><div class="app-header"><button class="back" id="appBack">‹ 홈</button><span id="appTitle">설정</span><span style="width:35px"></span></div><div class="app-content" id="appContent"></div></section>
<section class="view control" id="controlView"><button class="cc-done" id="ccDone">완료</button><div style="font-size:25px;font-weight:700;margin-bottom:17px">제어 센터</div><div class="cc-grid"><button class="cc-tile on" data-toggle="airplane"><span class="cc-symbol">✈</span>비행기 모드</button><button class="cc-tile on" data-toggle="wifi"><span class="cc-symbol">⌁</span>Wi-Fi</button><button class="cc-tile" data-toggle="bluetooth"><span class="cc-symbol">ᛒ</span>Bluetooth</button><button class="cc-tile" data-toggle="focus"><span class="cc-symbol">☾</span>집중 모드</button><button class="cc-tile cc-wide" data-toggle="rotation"><span class="cc-symbol">🔒</span>화면 방향 고정</button></div><div class="cc-sliders"><button class="cc-slider" id="brightness"><span>☼</span><small>밝기</small></button><button class="cc-slider" id="volume"><span>♫</span><small>음량</small></button></div><div style="margin-top:17px;font-size:12px;opacity:.85">타일을 눌러 기능을 켜거나 끄세요.</div></section>
<div id="notification" class="notification hidden"><strong>🔔 알림</strong><p id="notificationText">새로운 알림이 도착했습니다.</p></div><div id="toast" class="toast hidden"></div><div class="home-indicator" id="homeIndicator"></div></div><div class="power"></div></main>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let currentView='lock',currentApp='',noticeTimer=null,brightnessLevel=65,volumeLevel=65;
const apps=[['messages','메시지','💬','icon-messages'],['calendar','캘린더','📅','icon-calendar'],['photos','사진','🌈','icon-photos'],['camera','카메라','📷','icon-camera'],['weather','날씨','🌤️','icon-weather'],['clock','시계','🕘','icon-clock'],['maps','지도','🗺️','icon-map'],['settings','설정','⚙️','icon-settings'],['notes','메모','📝','icon-notes'],['safari','Safari','🧭','icon-safari'],['music','음악','♫','icon-music'],['mail','Mail','✉️','icon-mail'],['calculator','계산기','＋','icon-calculator'],['health','건강','♥','icon-health'],['store','App Store','A','icon-store'],['phone','전화','☎','icon-phone']];
function iconApp(a){return `<button class="app" data-app="${a[0]}"><span class="app-icon ${a[3]}">${a[0]==='calendar'?'<span style="font-size:10px;align-self:start;margin-top:5px">금요일</span><b>23</b>':a[2]}</span><span>${a[1]}</span></button>`}$('#appGrid').innerHTML=apps.map(iconApp).join('');$('#dock').innerHTML=['phone','safari','messages','music'].map(id=>iconApp(apps.find(a=>a[0]===id))).join('');
function setView(v){$$('.view').forEach(x=>x.classList.remove('active'));$('#'+v+'View').classList.add('active');currentView=v.replace('View','').toLowerCase();$('#homeIndicator').classList.toggle('darkbar',v==='appView');$('#notification').classList.add('hidden')}
function home(){setView('homeView');currentApp=''}function unlock(){if(currentView==='lock')home();else home()}$('#unlockArea').addEventListener('click',unlock);$('#homeIndicator').addEventListener('click',()=>{if(currentView==='control')home();else if(currentView==='app')home();else if(currentView==='lock')unlock();else setView('controlView')});$('#appBack').onclick=home;$('#ccDone').onclick=()=>home();
function toast(msg){let t=$('#toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>t.classList.add('hidden'),2100)}function notify(title,msg){$('#notification').querySelector('strong').textContent=title;$('#notificationText').textContent=msg;$('#notification').classList.remove('hidden');setTimeout(()=>$('#notification').classList.add('hidden'),3500)}
function openApp(id){currentApp=id;setView('appView');$('#appTitle').textContent=(apps.find(a=>a[0]===id)||['','앱'])[1];$('#appContent').innerHTML=renderApp(id);bindApp(id)}
document.addEventListener('click',e=>{let b=e.target.closest('[data-app]');if(b)openApp(b.dataset.app)});
function renderApp(id){if(id==='settings')return `<div class="profile"><div class="avatar">👤</div><div><strong>내 iPhone</strong><small>Apple 계정 · iCloud</small></div><span class="arrow">›</span></div><div class="section-title">연결</div><div class="settings-group">${row('✈','비행기 모드','<input type="checkbox" data-setting="airplane">','#ff9f0a')}${row('⌁','Wi-Fi','<span style="margin-left:auto;color:#777">My Wi-Fi</span><span class="arrow">›</span>','#0a84ff')}${row('ᛒ','Bluetooth','<span style="margin-left:auto;color:#777">켬</span><span class="arrow">›</span>','#0a84ff')}${row('📶','셀룰러','<span class="arrow">›</span>','#34c759')}</div><div class="section-title">설정</div><div class="settings-group">${row('🔔','알림','<span class="arrow">›</span>','#ff3b30')}${row('🌙','집중 모드','<span class="arrow">›</span>','#5856d6')}${row('☀','디스플레이 및 밝기','<input aria-label="밝기" type="range" min="20" max="100" value="65" data-setting="brightness">','#777')}${row('🔋','배터리','<span style="margin-left:auto;color:#777">87%</span><span class="arrow">›</span>','#34c759')}${row('🔒','개인정보 보호 및 보안','<span class="arrow">›</span>','#777')}</div><p style="font-size:12px;color:#888;text-align:center;margin:22px">iOS 스타일 UI 시뮬레이터 · 실제 설정은 변경되지 않습니다.</p>`;
if(id==='messages')return `<div class="chat-bg"><div class="messages" id="messages"><div class="bubble">안녕! 😊<br>이건 메시지 앱 시뮬레이션이야.</div><div class="bubble mine">오 신기하다!</div><div class="bubble">메시지를 직접 보내 볼 수 있어 💌</div></div><form class="chat-compose" id="chatForm"><input id="chatInput" placeholder="iMessage" autocomplete="off"><button>↑</button></form></div>`;
if(id==='photos')return `<div style="font-size:25px;font-weight:700;margin:6px 0 15px">최근 항목</div><div class="photos-grid">${['🌅','🌷','🌊','☁️','🌼','🌙','🍓','🦋','🌿','🏙️','🌸','🌈'].map((x,i)=>`<button class="photo" data-photo="${x}">${x}</button>`).join('')}</div><p style="font-size:12px;color:#888">샘플 사진 모음 · 실제 사진 보관함에 접근하지 않습니다.</p>`;
if(id==='notes')return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px"><span style="font-size:13px;color:#777">나의 메모</span><button id="saveNote" style="border:0;background:none;color:#0a84ff;font-size:15px">완료</button></div><textarea class="note-input" id="noteText" placeholder="메모를 작성하세요…"></textarea><p style="font-size:12px;color:#888">이 페이지를 새로고침하면 메모는 초기화돼요.</p>`;
if(id==='calculator')return `<div class="calc-display" id="calcDisplay">0</div><div class="calc">${['AC','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','='].map((x,i)=>`<button class="${['÷','×','−','+','='].includes(x)?'orange':['AC','±','%'].includes(x)?'dark':''} ${x==='0'?'zero':''}" data-calc="${x}">${x}</button>`).join('')}</div>`;
if(id==='safari')return `<form class="safari-search" id="searchForm"><input id="searchInput" placeholder="검색 또는 웹 사이트 이름 입력"><button>이동</button></form><div class="browser-page" id="browserPage"><div class="browser-mark">🧭</div><h2 style="text-align:center">어디로 갈까요?</h2><p style="text-align:center">주소나 검색어를 입력하면 이 데모 안에서 예시 화면을 보여줘요.</p><p style="text-align:center;color:#0a84ff">즐겨찾기　　읽기 목록</p></div>`;
if(id==='camera')return `<div style="height:100%;margin:-10px -16px -30px;background:#202027;display:flex;flex-direction:column;justify-content:space-between;align-items:center;color:white;padding:20px"><div style="align-self:flex-start;font-size:13px;opacity:.7">사진　　비디오　　인물 사진</div><div style="text-align:center"><div style="font-size:75px">📷</div><p>카메라 미리보기</p><small style="opacity:.65">실제 카메라를 사용하지 않는 데모</small></div><button id="shutter" style="width:72px;height:72px;border:6px solid #ddd;border-radius:50%;background:#fff;box-shadow:0 0 0 3px #777;font-size:23px">●</button></div>`;
if(id==='calendar')return `<div style="font-size:25px;font-weight:700;margin:5px 0 15px">2026년 10월</div><div style="display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:7px;font-size:13px">${['일','월','화','수','목','금','토',...Array.from({length:35},(_,i)=>i<4?'':String(i-3))].map((x,i)=>`<div style="padding:8px 0;${x==='23'?'background:#0a84ff;color:#fff;border-radius:50%;font-weight:700':''}">${x}</div>`).join('')}</div><div class="section-title">오늘의 일정</div><div class="settings-group"><div class="setting-row">📌 <span>새로운 하루 시작하기</span></div><div class="setting-row">☕ <span>잠깐 쉬어 가기</span></div></div>`;
if(id==='weather')return `<div style="text-align:center;padding:35px 0"><div style="font-size:23px">서울</div><div style="font-size:78px;font-weight:200">18°</div><div style="font-size:19px">맑음</div><p>최고 21° · 최저 13°</p></div><div class="settings-group">${['오전 9시 ☀️ 18°','오전 12시 ☀️ 21°','오후 3시 🌤️ 20°','오후 6시 🌙 16°'].map(x=>`<div class="setting-row">${x}</div>`).join('')}</div><p style="font-size:12px;color:#888">예시 날씨 데이터</p>`;
if(id==='clock')return `<div style="text-align:center;padding:35px 0"><div id="clockBig" style="font-size:56px;font-weight:200">09:41:00</div><p>세계 시계 · 서울</p><div class="settings-group" style="text-align:left;margin-top:25px">${row('⏱','스톱워치','<span class="arrow">›</span>','#ff9f0a')}${row('⏰','알람','<span class="arrow">›</span>','#ff9f0a')}${row('🌙','수면','<span class="arrow">›</span>','#5856d6')}</div></div>`;
if(id==='phone')return `<div style="text-align:center;padding-top:35px"><div style="width:95px;height:95px;margin:auto;border-radius:50%;background:#d8d8de;display:grid;place-items:center;font-size:42px">👤</div><h2>즐겨찾기</h2><p style="color:#777">연락처 데모</p><button id="callDemo" style="border:0;background:#34c759;color:white;border-radius:25px;padding:12px 28px;font-size:16px">☎ 통화 시뮬레이션</button></div>`;
if(id==='music')return `<div style="text-align:center;padding:28px 0"><div style="width:210px;height:210px;margin:auto;border-radius:20px;background:linear-gradient(135deg,#fca5d3,#8b5cf6);display:grid;place-items:center;font-size:75px;color:#fff">♫</div><h2>나만의 플레이리스트</h2><p style="color:#777">샘플 트랙 · 실제 음악 재생 없음</p><div class="settings-group">${['Moonlight','Blue Hour','Soft Morning'].map((x,i)=>`<div class="setting-row"><span>♪</span><span>${x}</span><button data-track="${x}" style="margin-left:auto;border:0;background:none;color:#0a84ff">▶</button></div>`).join('')}</div></div>`;
if(id==='mail')return `<div style="font-size:25px;font-weight:700;margin:5px 0 15px">받은 편지함</div><div class="settings-group">${[['👋','환영합니다','아이폰 UI 시뮬레이터에 오신 걸 환영해요.'],['🌤️','오늘의 소식','오늘도 좋은 하루 보내세요!'],['💌','나에게 보내는 편지','작은 순간들도 소중히 간직하기.']].map(a=>`<div class="setting-row" style="align-items:flex-start;padding:15px 12px"><span>${a[0]}</span><div><b>${a[1]}</b><div style="font-size:13px;color:#777;margin-top:5px">${a[2]}</div></div></div>`).join('')}</div>`;
if(id==='maps')return `<div class="browser-page" style="background:linear-gradient(35deg,#d7e8d1,#f3e9cb,#c4e0e7);text-align:center"><div style="font-size:70px;margin:40px 0">📍</div><h2>지도</h2><p>서울 · 현재 위치 예시</p><button id="mapExplore" style="background:#0a84ff;color:white;border:0;padding:10px 18px;border-radius:20px">주변 둘러보기</button></div>`;
if(id==='health')return `<div style="text-align:center;padding:20px 0"><div style="font-size:56px;color:#ff375f">♥</div><h2>건강 요약</h2><p style="color:#777">오늘의 건강 데이터 예시</p></div><div class="settings-group">${row('🚶','걸음 수','<b style="margin-left:auto">4,280</b>','#34c759')}${row('💧','수분 섭취','<b style="margin-left:auto">4잔</b>','#0a84ff')}${row('😴','수면','<b style="margin-left:auto">7시간 20분</b>','#5856d6')}</div>`;
if(id==='store')return `<div style="font-size:25px;font-weight:700;margin:5px 0 15px">오늘의 앱</div><div class="browser-page" style="background:linear-gradient(135deg,#c4eaff,#a4a9f7);color:#172044"><small>오늘의 추천</small><h2>새로운 가능성을<br>발견해 보세요.</h2><p>앱스토어 스타일의 샘플 카드</p><div style="font-size:55px;text-align:right">✨</div></div><div class="settings-group"><div class="setting-row">🎨 <span>창작과 디자인</span><span class="arrow">›</span></div><div class="setting-row">📚 <span>생산성</span><span class="arrow">›</span></div></div>`;
return `<div style="text-align:center;padding:40px 10px"><div style="font-size:55px">📱</div><h2>${(apps.find(a=>a[0]===id)||[])[1]||'앱'}</h2><p>이 앱은 시뮬레이션 화면입니다.</p></div>`}
function row(emoji,label,right,color){return `<div class="setting-row"><span class="setting-emoji" style="background:${color}">${emoji}</span><span>${label}</span>${right}</div>`}
function bindApp(id){if(id==='settings'){$$('[data-setting="airplane"]').forEach(x=>x.onchange=()=>toast(x.checked?'비행기 모드 켬':'비행기 모드 끔'));$$('[data-setting="brightness"]').forEach(x=>x.oninput=()=>{brightnessLevel=+x.value;$('#screen').style.filter=`brightness(${brightnessLevel/65})`})}
if(id==='messages')$('#chatForm').onsubmit=e=>{e.preventDefault();let i=$('#chatInput'),v=i.value.trim();if(!v)return;let b=document.createElement('div');b.className='bubble mine';b.textContent=v;$('#messages').appendChild(b);i.value='';$('#messages').scrollTop=$('#messages').scrollHeight;setTimeout(()=>{let r=document.createElement('div');r.className='bubble';r.textContent='메시지가 잘 도착했어! 💗';$('#messages').appendChild(r);$('#messages').scrollTop=$('#messages').scrollHeight},500)};
if(id==='photos')$$('[data-photo]').forEach(x=>x.onclick=()=>toast(x.dataset.photo+' 사진을 선택했어요'));
if(id==='notes')$('#saveNote').onclick=()=>toast('메모가 저장된 것처럼 표시됐어요');
if(id==='calculator'){let expr='',fresh=true;const d=$('#calcDisplay');$$('[data-calc]').forEach(b=>b.onclick=()=>{let x=b.dataset.calc;if(x==='AC'){expr='';d.textContent='0';fresh=true;return}if(x==='±'){if(expr)expr=String(-Number(expr));d.textContent=expr||'0';return}if(x==='%'){expr=String((Number(expr)||0)/100);d.textContent=expr;return}if(x==='='){try{let safe=expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');if(!/^[0-9+*/.() -]+$/.test(safe))throw 0;let result=Function('return ('+safe+')')();expr=Number.isFinite(result)?String(+result.toFixed(8)):'오류';d.textContent=expr;fresh=true}catch{d.textContent='오류';expr='';fresh=true}return}if(fresh&&/[0-9.]/.test(x))expr='';fresh=false;expr+=x;d.textContent=expr.length>12?expr.slice(-12):expr})}
if(id==='safari')$('#searchForm').onsubmit=e=>{e.preventDefault();let q=$('#searchInput').value.trim();if(!q)return;let page=$('#browserPage');page.innerHTML=`<div class="browser-mark">🧭</div><h2>${escapeHtml(q)}</h2><p>이 시뮬레이터는 웹페이지를 실제로 불러오지 않아요.</p><p>입력한 주소/검색어: <b>${escapeHtml(q)}</b></p><button id="goBackBrowser" style="border:0;background:#0a84ff;color:white;border-radius:18px;padding:9px 14px">시작 페이지로</button>`;$('#goBackBrowser').onclick=()=>{page.innerHTML='<div class="browser-mark">🧭</div><h2 style="text-align:center">어디로 갈까요?</h2><p style="text-align:center">주소나 검색어를 입력하면 이 데모 안에서 예시 화면을 보여줘요.</p>'}};
if(id==='camera')$('#shutter').onclick=()=>toast('찰칵! 사진 촬영을 흉내 냈어요 📸');if(id==='phone')$('#callDemo').onclick=()=>notify('☎ 통화 시뮬레이션','실제 전화는 걸리지 않았어요.');if(id==='music')$$('[data-track]').forEach(x=>x.onclick=()=>toast('선택한 트랙: '+x.dataset.track));if(id==='maps')$('#mapExplore').onclick=()=>toast('주변 장소를 둘러보는 데모예요');}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('#flashBtn').onclick=e=>{e.stopPropagation();toast('손전등을 켠 것처럼 표시했어요 🔦')};$('#cameraBtn').onclick=e=>{e.stopPropagation();home();openApp('camera')};let downY=0,downX=0;$('#screen').addEventListener('touchstart',e=>{downY=e.touches[0].clientY;downX=e.touches[0].clientX},{passive:true});$('#screen').addEventListener('touchend',e=>{let dy=e.changedTouches[0].clientY-downY,dx=e.changedTouches[0].clientX-downX;if(downY<65&&dy>70){if(currentView==='home'||currentView==='app')setView('controlView')}else if(dy < -65){if(currentView==='lock')unlock();else if(currentView==='control')home();else if(currentView==='app')home()}else if(Math.abs(dx)>85&&currentView==='home'){toast('홈 화면 페이지 이동은 데모 기능이에요')}},{passive:true});$$('[data-toggle]').forEach(b=>b.onclick=()=>{b.classList.toggle('on');let key=b.dataset.toggle;toast(b.textContent.trim()+' '+(b.classList.contains('on')?'켬':'끔'))});$('#brightness').onclick=()=>{brightnessLevel=brightnessLevel>=90?35:brightnessLevel+15;$('#screen').style.filter=`brightness(${brightnessLevel/65})`;toast('밝기 '+brightnessLevel+'%')};$('#volume').onclick=()=>{volumeLevel=volumeLevel>=90?25:volumeLevel+15;toast('음량 '+volumeLevel+'%')};
function tick(){let d=new Date(),h=String(d.getHours()).padStart(2,'0'),m=String(d.getMinutes()).padStart(2,'0'),s=String(d.getSeconds()).padStart(2,'0');$('#statusTime').textContent=h+':'+m;$('#lockTime').textContent=(d.getHours()%12||12)+':'+m;$('#lockDate').textContent=`${d.getMonth()+1}월 ${d.getDate()}일 ${['일요일','월요일','화요일','수요일','목요일','금요일','토요일'][d.getDay()]}`;$('#homeDate').textContent=`${d.getMonth()+1}월 ${d.getDate()}일`;$('#lockCal').textContent=d.getDate();let c=$('#clockBig');if(c)c.textContent=h+':'+m+':'+s}tick();setInterval(tick,1000);
</script></body></html>
